services:
  db:
    image: postgres:16-alpine
    container_name: chiron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiron
      POSTGRES_PASSWORD: chiron
      POSTGRES_DB: chiron
    ports:
      - "5432:5432"
    volumes:
      - chiron_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron -d chiron"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chiron_pgdata:
