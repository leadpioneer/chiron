name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron
          POSTGRES_DB: chiron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://chiron:chiron@localhost:5432/chiron_test
      TEST_DATABASE_URL: postgres://chiron:chiron@localhost:5432/chiron_test
      AUTH_SECRET: ci-secret-change-me-32-characters
      AUTH_DEV_MODE: "1"
      APP_URL: http://localhost:3100
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare clean test database
        run: npm run db:test:prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Domain tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Full cycle simulator
        run: npm run test:cycle

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7
